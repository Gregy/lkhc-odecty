[project]
name = "lkhc-odecty"
version = "0.1.0"
description = "LKHC electricity meter readings"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.5",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    # not uvicorn[standard]: its pyyaml has no CPython 3.15 wheel and YAML log configs are not used
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "httptools>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "watchfiles>=1.3.0",  # uvicorn --reload
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"
extend-exclude = ["alembic/versions", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "C4", "PIE"]
ignore = [
    "B008",    # FastAPI Depends() in defaults
    "RUF001",  # Czech text contains look-alike characters (e.g. en dash)
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N817"]  # `Decimal as D` in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:.*httpx2.*:DeprecationWarning",
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]
